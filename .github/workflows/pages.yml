name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "restaurant-website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: restaurant-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: restaurant-website/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (type-check, React build, pre-render)
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: restaurant-website/dist
      - id: deployment
        uses: actions/deploy-pages@v4
