name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "restaurant-website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset URLs with this commit so browsers never mix old and new files
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" restaurant-website/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: restaurant-website
      - id: deployment
        uses: actions/deploy-pages@v4
